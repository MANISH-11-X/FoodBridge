
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NGO Registration | FoodBridge</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f0fdf4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 480px;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 8px 30px #00000012;
        }

        h1 { color: #166534; text-align: center; }
        p { text-align: center; color: #64748b; }

        label {
            display: block;
            margin: 15px 0 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 25px;
            background: #15803d;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover { background: #166534; }

        .message {
            background: #dcfce7;
            color: #166534;
            padding: 12px;
            border-radius: 8px;
            margin: 10px 0;
        }

        a { color: #15803d; text-decoration: none; }
        .bottom { margin-top: 20px; }
    </style>
</head>

<body>
<div class="container">

    <h1>FoodBridge</h1>
    <p>Register your NGO and connect with food donors.</p>

    {% with messages = get_flashed_messages() %}
        {% for message in messages %}
            <div class="message">{{ message }}</div>
        {% endfor %}
    {% endwith %}

    <form action="{{ url_for('ngo_register') }}" method="POST">

        <label>NGO Name</label>
        <input type="text" name="name"
               placeholder="Enter NGO name" required>

        <label>Email Address</label>
        <input type="email" name="email"
               placeholder="Enter email" required>

        <label>Password</label>
        <input type="password" name="password"
               placeholder="Create password"
               minlength="8" required>

        <label>Contact Number</label>
        <input type="tel" name="phone"
               placeholder="Enter phone number" required>

        <label>Address</label>
        <input type="text" name="address"
               placeholder="Enter NGO address" required>

        <label>City</label>
        <input type="text" name="city"
               placeholder="Enter city">

        <button type="submit">Register NGO</button>
    </form>

    <p class="bottom">
        Already registered?
        <a href="{{ url_for('ngo_login') }}">Login here</a>
    </p>

    <p>
        <a href="{{ url_for('donarregistration') }}">
            Register as a Donor
        </a>
    </p>

</div>
</body>
</html>
